name: Build Husen Hisab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Zip Project
        run: |
          # Zip ફાઈલ શોધીને આપોઆપ extract કરશે
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
            # જો zip ની અંદર બીજા ફોલ્ડરમાં ફાઈલો હોય તો બહાર લાવી દેશે
            if [ -d "husen-hisab" ] && [ ! -d "app" ]; then
              cp -r husen-hisab/* .
            fi
          fi
          chmod +x gradlew || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusenHisab-APK
          path: "app/build/outputs/apk/debug/*.apk"
          
