name: Build Husen Hisab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Zip Project
        run: |
          # ઉપલબ્ધ Zip ફાઇલ શોધીને બહાર કાઢો
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi

          # જો અનઝિપ કર્યા પછી અંદર બીજું કોઈ સબ-ફોલ્ડર બન્યું હોય તો ફાઇલો બહાર લાવો
          if [ ! -d "app" ]; then
            SUBDIR=$(find . -maxdepth 2 -type d -name "app" | head -n 1 | sed 's|/app||')
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Moving files from $SUBDIR to root..."
              cp -r "$SUBDIR"/* .
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusenHisab-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
