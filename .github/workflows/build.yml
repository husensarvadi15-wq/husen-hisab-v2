name: Build Husen Hisab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Extract and Locate Project Root
        run: |
          # 1. ઝિપ ફાઇલ શોધીને અનઝિપ કરો
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d unzipped_project
          fi

          # 2. settings.gradle કે settings.gradle.kts ક્યાં છે તે શોધો
          SETTINGS_PATH=$(find unzipped_project -name "settings.gradle*" | head -n 1)

          if [ -n "$SETTINGS_PATH" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_PATH")
            echo "Found project root at: $PROJECT_DIR"
            # બધી ફાઇલો સીધી મુખ્ય રૂટ ડિરેક્ટરીમાં લાવો
            cp -r "$PROJECT_DIR"/* .
          else
            echo "No settings.gradle found in zip, checking root..."
          fi

          # 3. જો gradlew હોય તો એક્ઝિક્યુટ પરમિશન આપો
          chmod +x gradlew 2>/dev/null || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusenHisab-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
