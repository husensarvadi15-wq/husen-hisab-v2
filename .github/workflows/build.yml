name: Build Husen Hisab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Inspect and Auto-Fix Project Structure
        run: |
          echo "=== 1. Checking repository files ==="
          ls -la

          # Zip ફાઇલ શોધીને અનઝિપ કરો
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Extracting..."
            unzip -q -o "$ZIP_FILE"
          else
            echo "No zip file found in root!"
          fi

          echo "=== 2. Checking files after unzip ==="
          find . -maxdepth 3 -not -path '*/.*'

          # જો settings.gradle કોઈ પેટા-ફોલ્ડરમાં હોય તો બહાર લાવો
          SETTINGS_FILE=$(find . -name "settings.gradle*" -not -path '*/.*' | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
            echo "Project root found at: $PROJECT_ROOT"
            if [ "$PROJECT_ROOT" != "." ]; then
              cp -r "$PROJECT_ROOT"/* .
            fi
          else
            echo "Warning: settings.gradle not found in zip! Creating default Android structure..."
            mkdir -p app/src/main/res/values
            mkdir -p app/src/main/res/xml
            mkdir -p app/src/main/res/drawable

            cat << 'EOF' > settings.gradle.kts
            pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories {
                    google()
                    mavenCentral()
                }
            }
            rootProject.name = "HusenHisab"
            include(":app")
            EOF

            cat << 'EOF' > build.gradle.kts
            plugins {
                id("com.android.application") version "8.2.0" apply false
                id("org.jetbrains.kotlin.android") version "1.9.20" apply false
            }
            EOF
          fi

          chmod +x gradlew 2>/dev/null || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
            gradle :app:assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HusenHisab-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
