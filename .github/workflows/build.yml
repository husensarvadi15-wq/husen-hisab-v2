name: Generate Clean APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-clean-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Create Complete Clean Offline Project
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/sarvadiverse/husenhisab/ui/theme
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HusenHisab"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.sarvadiverse.husenhisab"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.sarvadiverse.husenhisab"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf("-opt-in=androidx.compose.material3.ExperimentalMaterial3Api")
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.4"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.activity:activity-ktx:1.8.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0")
              implementation(platform("androidx.compose:compose-bom:2023.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="હુસેન હિસાબ"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.HusenHisab">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.HusenHisab">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">હુસેન હિસાબ</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.HusenHisab" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/sarvadiverse/husenhisab/ui/theme/Theme.kt
          package com.sarvadiverse.husenhisab.ui.theme
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          @Composable
          fun HusenHisabTheme(content: @Composable () -> Unit) {
              MaterialTheme(content = content)
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/sarvadiverse/husenhisab/AppViewModel.kt
          package com.sarvadiverse.husenhisab
          import androidx.lifecycle.ViewModel
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow

          data class DailyWorkEntry(
              val id: String = System.currentTimeMillis().toString(),
              val date: String = "",
              val lineName: String = "",
              val smallPoles: Int = 0,
              val largePoles: Int = 0,
              val smallPoleRate: Double = 0.0,
              val largePoleRate: Double = 0.0,
              val totalAmount: Double = 0.0
          )

          data class LedgerEntry(
              val id: String = System.currentTimeMillis().toString(),
              val personName: String = "",
              val amountPaid: Double = 0.0
          )

          class AppViewModel : ViewModel() {
              private val _workEntries = MutableStateFlow<List<DailyWorkEntry>>(emptyList())
              val workEntries: StateFlow<List<DailyWorkEntry>> = _workEntries.asStateFlow()

              private val _ledgerEntries = MutableStateFlow<List<LedgerEntry>>(emptyList())
              val ledgerEntries: StateFlow<List<LedgerEntry>> = _ledgerEntries.asStateFlow()

              fun addWorkEntry(line: String, small: Int, large: Int) {
                  val total = (small * 100.0) + (large * 200.0)
                  _workEntries.value = _workEntries.value + DailyWorkEntry(
                      lineName = line,
                      smallPoles = small,
                      largePoles = large,
                      totalAmount = total
                  )
              }

              fun addLedgerEntry(person: String, amount: Double) {
                  _ledgerEntries.value = _ledgerEntries.value + LedgerEntry(
                      personName = person,
                      amountPaid = amount
                  )
              }

              fun getTotalEarnings(): Double = _workEntries.value.sumOf { it.totalAmount }
              fun getTotalPaid(): Double = _ledgerEntries.value.sumOf { it.amountPaid }
              fun getNetBalance(): Double = getTotalEarnings() - getTotalPaid()
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/sarvadiverse/husenhisab/MainActivity.kt
          package com.sarvadiverse.husenhisab
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.lifecycle.ViewModelProvider
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import androidx.navigation.NavController
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.rememberNavController
          import com.sarvadiverse.husenhisab.ui.theme.HusenHisabTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val viewModel = ViewModelProvider(this)[AppViewModel::class.java]
                  setContent {
                      HusenHisabTheme {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              val navController = rememberNavController()
                              NavHost(navController = navController, startDestination = "dashboard") {
                                  composable("dashboard") { DashboardScreen(navController, viewModel) }
                                  composable("daily_work") { DailyWorkScreen(navController, viewModel) }
                                  composable("ledger") { LedgerScreen(navController, viewModel) }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun DashboardScreen(navController: NavController, viewModel: AppViewModel) {
              Scaffold(topBar = { TopAppBar(title = { Text("હુસેન હિસાબ") }) }) { p ->
                  Column(modifier = Modifier.padding(p).padding(16.dp)) {
                      Card(modifier = Modifier.fillMaxWidth()) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("કુલ આવક: ₹${viewModel.getTotalEarnings()}")
                              Text("કુલ ચૂકવણી: ₹${viewModel.getTotalPaid()}")
                              Divider(modifier = Modifier.padding(vertical = 8.dp))
                              Text("ચોખ્ખી બચત: ₹${viewModel.getNetBalance()}", style = MaterialTheme.typography.titleLarge)
                          }
                      }
                      Spacer(modifier = Modifier.height(16.dp))
                      Button(onClick = { navController.navigate("daily_work") }, modifier = Modifier.fillMaxWidth()) {
                          Text("પોલ / લાઇન કામ ઉમેરો")
                      }
                      Spacer(modifier = Modifier.height(8.dp))
                      Button(onClick = { navController.navigate("ledger") }, modifier = Modifier.fillMaxWidth()) {
                          Text("ખાતાવહી / ચૂકવણી")
                      }
                  }
              }
          }

          @Composable
          fun DailyWorkScreen(navController: NavController, viewModel: AppViewModel) {
              var line by remember { mutableStateOf("") }
              var small by remember { mutableStateOf("") }
              var large by remember { mutableStateOf("") }
              val list by viewModel.workEntries.collectAsState()

              Scaffold(topBar = { TopAppBar(title = { Text("કામ નોંધણી") }) }) { p ->
                  Column(modifier = Modifier.padding(p).padding(16.dp)) {
                      OutlinedTextField(value = line, onValueChange = { line = it }, label = { Text("લાઇનનું નામ") }, modifier = Modifier.fillMaxWidth())
                      OutlinedTextField(value = small, onValueChange = { small = it }, label = { Text("નાના પોલ") }, modifier = Modifier.fillMaxWidth())
                      OutlinedTextField(value = large, onValueChange = { large = it }, label = { Text("મોટા પોલ") }, modifier = Modifier.fillMaxWidth())
                      Spacer(modifier = Modifier.height(8.dp))
                      Button(onClick = {
                          viewModel.addWorkEntry(line, small.toIntOrNull() ?: 0, large.toIntOrNull() ?: 0)
                          line = ""; small = ""; large = ""
                      }, modifier = Modifier.fillMaxWidth()) {
                          Text("સેવ કરો")
                      }
                      LazyColumn(modifier = Modifier.padding(top = 8.dp)) {
                          items(list) { e ->
                              Text("${e.lineName}: નાના ${e.smallPoles}, મોટા ${e.largePoles} = ₹${e.totalAmount}")
                          }
                      }
                  }
              }
          }

          @Composable
          fun LedgerScreen(navController: NavController, viewModel: AppViewModel) {
              var name by remember { mutableStateOf("") }
              var amt by remember { mutableStateOf("") }
              val list by viewModel.ledgerEntries.collectAsState()

              Scaffold(topBar = { TopAppBar(title = { Text("ખાતાવહી") }) }) { p ->
                  Column(modifier = Modifier.padding(p).padding(16.dp)) {
                      OutlinedTextField(value = name, onValueChange = { name = it }, label = { Text("નામ") }, modifier = Modifier.fillMaxWidth())
                      OutlinedTextField(value = amt, onValueChange = { amt = it }, label = { Text("રકમ (₹)") }, modifier = Modifier.fillMaxWidth())
                      Spacer(modifier = Modifier.height(8.dp))
                      Button(onClick = {
                          viewModel.addLedgerEntry(name, amt.toDoubleOrNull() ?: 0.0)
                          name = ""; amt = ""
                      }, modifier = Modifier.fillMaxWidth()) {
                          Text("ચૂકવણી સેવ કરો")
                      }
                      LazyColumn(modifier = Modifier.padding(top = 8.dp)) {
                          items(list) { e ->
                              Text("${e.personName}: ₹${e.amountPaid}")
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusenHisab-Clean-APK
          path: "app/build/outputs/apk/debug/*.apk"
          
